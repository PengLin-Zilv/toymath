name: Tests

on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the repo
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.14'

            - name: Install toymath and pytest
              run: |
                python -m pip install --upgrade pip
                pip install pytest

            - name: Run tests
              run: pytest